# Pull PostHog capture from ghcr.io (reachable from GitHub runners),
# upload a docker-save artifact for air-gapped / China deploy hosts that
# cannot pull ghcr directly. Load on the host with:
#   gh run download <run-id> -n posthog-capture -D /tmp
#   gunzip -c /tmp/posthog-capture-*.tar.gz | docker load
#   docker tag ghcr.io/posthog/posthog/capture:<tag> \
#     172.16.0.67:8881/deeprouter/posthog-capture:<tag>
#   docker push 172.16.0.67:8881/deeprouter/posthog-capture:<tag>
name: Mirror capture image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'ghcr.io/posthog/posthog/capture tag'
        required: true
        default: 'master'
        type: string

concurrency:
  group: mirror-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Pull capture from ghcr
        run: |
          set -euo pipefail
          SRC="ghcr.io/posthog/posthog/capture:${{ inputs.source_tag }}"
          echo "Pulling ${SRC}"
          docker pull "${SRC}"
          docker image inspect "${SRC}" --format '{{.Id}} {{.Size}}'

      - name: Save and compress
        run: |
          set -euo pipefail
          SRC="ghcr.io/posthog/posthog/capture:${{ inputs.source_tag }}"
          OUT="posthog-capture-${{ inputs.source_tag }}.tar.gz"
          # sanitize filename (tags can contain /)
          OUT="$(echo "${OUT}" | tr '/:' '__')"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          docker save "${SRC}" | gzip -1 > "${OUT}"
          ls -lh "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posthog-capture
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
