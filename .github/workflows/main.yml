name: Debug Repo Structure

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Show full structure
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo ""
          echo "=== 根目录所有文件 ==="
          ls -la
          echo ""
          echo "=== 查找所有目录（深度3） ==="
          find . -maxdepth 3 -type d 2>/dev/null
          echo ""
          echo "=== 查找所有 package.json ==="
          find . -name "package.json" -type f 2>/dev/null
          echo ""
          echo "=== 查找 web 目录 ==="
          find . -name "web" -type d 2>/dev/null
          echo ""
          echo "=== 打印仓库根目录内容 ==="
          ls -laR | head -100
