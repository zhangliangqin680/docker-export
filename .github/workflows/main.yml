name: Export Docker Images

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Pull Docker images
        run: |
          docker pull oven/bun:1
      
      - name: Export images
        run: |
          docker save oven/bun:1 | gzip > bun.tar.gz
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            bun.tar.gz
