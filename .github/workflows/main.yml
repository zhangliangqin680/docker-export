name: Export node_modules

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js 版本'
        required: false
        default: '20'
        type: choice
        options:
          - '20'
          - '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Show directory structure
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo ""
          echo "=== 根目录文件列表 ==="
          ls -la
          echo ""
          echo "=== 查找 web 目录 ==="
          find . -type d -name "web" 2>/dev/null
          echo ""
          echo "=== 查找 package.json ==="
          find . -name "package.json" -type f 2>/dev/null

      - name: Install dependencies for web/default
        run: |
          echo "安装 web/default 依赖..."
          
          # 如果 web/default 存在
          if [ -d "web/default" ]; then
            cd web/default
            npm config set registry https://registry.npmmirror.com
            npm install --legacy-peer-deps --ignore-scripts
            cd ../..
          else
            echo "web/default 目录不存在，跳过"
          fi

      - name: Install dependencies for web/classic
        run: |
          echo "安装 web/classic 依赖..."
          
          if [ -d "web/classic" ]; then
            cd web/classic
            npm config set registry https://registry.npmmirror.com
            npm install --legacy-peer-deps --ignore-scripts
            cd ../..
          else
            echo "web/classic 目录不存在，跳过"
          fi

      - name: Pack node_modules
        run: |
          echo "打包 node_modules..."
          
          if [ -d "web/default/node_modules" ]; then
            tar -czf node_modules_default.tar.gz -C web/default node_modules
            cp web/default/package-lock.json package-lock-default.json
            echo "✅ node_modules_default.tar.gz 已生成"
          else
            echo "❌ web/default/node_modules 不存在"
          fi
          
          if [ -d "web/classic/node_modules" ]; then
            tar -czf node_modules_classic.tar.gz -C web/classic node_modules
            cp web/classic/package-lock.json package-lock-classic.json
            echo "✅ node_modules_classic.tar.gz 已生成"
          else
            echo "❌ web/classic/node_modules 不存在"
          fi

      - name: List generated files
        run: |
          echo "=== 生成的文件 ==="
          ls -la *.tar.gz 2>/dev/null || echo "没有 tar.gz 文件"
          ls -la *.json 2>/dev/null || echo "没有 json 文件"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-modules-packages
          compression-level: 0
          retention-days: 7
          path: |
            *.tar.gz
            *.json
