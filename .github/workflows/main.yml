name: Build Complete Offline Package

on:
  workflow_dispatch:
    inputs:
      include_bun:
        description: '是否包含 Bun 镜像'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 拉取所有需要的 Docker 基础镜像
      - name: Pull Docker base images
        run: |
          echo "拉取 Docker 基础镜像..."
          docker pull node:22-bookworm
          docker pull golang:1.26.1-bookworm
          docker pull debian:bookworm-slim
          
          if [ "${{ github.event.inputs.include_bun }}" == "true" ]; then
            docker pull oven/bun:1
          fi
          
          echo "已拉取的镜像列表："
          docker images | grep -E "node|golang|debian|bun"
      
      # 使用 Node.js 22 安装前端依赖
      - name: Install npm dependencies
        run: |
          echo "安装 npm 依赖 (Node.js 22)..."
          
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            node:22-bookworm \
            bash -c "
              npm config set registry https://registry.npmmirror.com
              cd web/default && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
              cd ../classic && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
            "
          
          echo "打包 node_modules..."
          tar -czf node_modules_default.tar.gz -C web/default node_modules
          tar -czf node_modules_classic.tar.gz -C web/classic node_modules
          
          cp web/default/package-lock.json package-lock-default.json
          cp web/classic/package-lock.json package-lock-classic.json
      
      # 使用 Bun 安装前端依赖（可选）
      - name: Install bun dependencies
        if: github.event.inputs.include_bun == 'true'
        run: |
          echo "安装 Bun 依赖..."
          
          docker run --rm -v $(pwd):/app -w /app oven/bun:1 bash -c "
            cd web/default && bun install --force --no-cache --ignore-scripts
            cd ../classic && bun install --force --no-cache --ignore-scripts
          "
          
          tar -czf bun_modules_default.tar.gz -C web/default node_modules 2>/dev/null || true
          tar -czf bun_modules_classic.tar.gz -C web/classic node_modules 2>/dev/null || true
          cp web/default/bun.lock bun-lock-default.json 2>/dev/null || true
          cp web/classic/bun.lock bun-lock-classic.json 2>/dev/null || true
      
      # 导出 Docker 镜像
      - name: Export Docker images
        run: |
          echo "导出 Docker 镜像..."
          docker save node:22-bookworm | gzip > node22.tar.gz
          docker save golang:1.26.1-bookworm | gzip > golang.tar.gz
          docker save debian:bookworm-slim | gzip > debian.tar.gz
          
          if [ "${{ github.event.inputs.include_bun }}" == "true" ]; then
            docker save oven/bun:1 | gzip > bun.tar.gz
          fi
          
          ls -lh *.tar.gz
      
      # 构建最终的项目镜像
      - name: Build final project image
        run: |
          echo "构建项目镜像..."
          sed -i 's/node:20-bookworm/node:22-bookworm/g' Dockerfile 2>/dev/null || true
          docker build -t prism-api:latest .
          docker save prism-api:latest | gzip > prism-api-full.tar.gz
      
      # 上传所有产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: complete-offline-package
          compression-level: 0
          retention-days: 7
          path: |
            *.tar.gz
            *.json
